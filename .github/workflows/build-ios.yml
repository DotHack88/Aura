name: Build iOS IPA (Aura)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'ios-v*'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./ios
        run: npm install --legacy-peer-deps

      - name: Patch Expo Swift packages for Xcode toolchain
        run: python3 .github/scripts/patch-expo.py

      - name: Run Expo Prebuild
        working-directory: ./ios
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ./ios/ios
        run: pod install

      - name: Build Xcode Archive (Unsigned)
        working-directory: ./ios/ios
        run: |
          xcodebuild -workspace Aura.xcworkspace \
            -scheme Aura \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Aura.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package Unsigned IPA
        working-directory: ./ios/ios
        run: |
          mkdir -p Payload
          cp -r build/Aura.xcarchive/Products/Applications/*.app Payload/
          zip -qry "../../Aura.ipa" Payload
          ls -lh ../../Aura.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-iOS-IPA
          path: Aura.ipa
          retention-days: 14


name: Build iOS IPA (Aura)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'ios-v*'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26.4+
        run: |
          set -e
          echo "Installed Xcode versions:"
          ls /Applications | grep -i xcode || true
          # Pick the highest installed Xcode_26.x bundle (SDK 58 requires Xcode 26+).
          XCODE_APP=$(ls /Applications | grep -E '^Xcode_26' | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode_26.x found; falling back to the highest Xcode bundle."
            XCODE_APP=$(ls /Applications | grep -iE '^Xcode' | sort -V | tail -n 1)
          fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          xcodebuild -version
          # Fail loudly if the selected toolchain is older than Xcode 26.
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["xcodebuild", "-version"], capture_output=True, text=True).stdout
          m = re.search(r"Xcode (\d+)", out)
          xcode_major = int(m.group(1)) if m else 0
          print(out.strip())
          if xcode_major < 26:
              sys.exit(f"ERROR: Xcode {xcode_major} is too old; SDK 58 requires Xcode 26+")
          print(f"OK: Xcode {xcode_major} selected")
          PY

      - name: Install Dependencies
        working-directory: ./ios
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        working-directory: ./ios
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ./ios/ios
        run: pod install

      - name: Patch Expo for Xcode 26 / modules-core compatibility
        run: python3 .github/scripts/patch-expo.py

      - name: Build Xcode Archive (Unsigned)
        working-directory: ./ios/ios
        run: |
          xcodebuild -workspace Aura.xcworkspace \
            -scheme Aura \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Aura.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package Unsigned IPA
        working-directory: ./ios/ios
        run: |
          mkdir -p Payload
          cp -r build/Aura.xcarchive/Products/Applications/*.app Payload/
          zip -qry "../../Aura.ipa" Payload
          ls -lh ../../Aura.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-iOS-IPA
          path: Aura.ipa
          retention-days: 14

